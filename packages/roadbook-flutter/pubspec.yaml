name: roadbook_flutter
description: 小肥路书 Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.0

  # 网络
  dio: ^5.4.3+1

  # 本地持久化
  shared_preferences: ^2.3.1

  # 图片
  image_picker: ^1.1.2
  flutter_image_compress: ^2.2.0

  # 工具
  intl: ^0.19.0
  crypto: ^3.0.3

  # 字体
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
