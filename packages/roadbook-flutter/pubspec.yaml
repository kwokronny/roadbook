name: roadbook_flutter
description: 小肥路书 Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.0

  # 网络
  dio: ^5.4.3+1

  # 本地持久化
  shared_preferences: ^2.3.1

  # 图片
  image_picker: ^1.1.2
  flutter_image_compress: ^2.2.0

  # 工具
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5

  # 字体
  google_fonts: ^6.2.1

  # 高德地图
  amap_flutter_map: ^3.0.0
  amap_flutter_base: ^3.0.0
  lpinyin: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

dependency_overrides:
  amap_flutter_map:
    path: patches/amap_flutter_map
  amap_flutter_base:
    path: patches/amap_flutter_base

flutter:
  uses-material-design: true
