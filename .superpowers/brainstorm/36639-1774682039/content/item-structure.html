<h2>行李清单 — 物品结构</h2>
<p class="subtitle">选择物品的组织方式</p>

<style>
.phone { width: 220px; background: #1C1C1E; border-radius: 28px; padding: 12px 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); flex-shrink: 0; }
.phone-screen { background: #F2F2F7; border-radius: 20px; overflow: hidden; min-height: 380px; }

.nav-sub { font-size: 10px; color: #8E8E93; }

.item-card { background: #fff; margin: 0 8px 4px; border-radius: 10px; overflow: hidden; }
.item-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 0.5px solid rgba(60,60,67,0.08); }

.check { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #C7C7CC; flex-shrink: 0; }
.check.done { background: #FF5B2E; border-color: #FF5B2E; display: flex; align-items: center; justify-content: center; }
.check.done::after { content: "✓"; color: white; font-size: 8px; }
.item-text { font-size: 11px; color: #1C1C1E; flex: 1; }
.item-text.done { color: #8E8E93; text-decoration: line-through; }
.cat-badge { font-size: 8px; padding: 1px 5px; border-radius: 8px; font-weight: 600; }
.add-row { display: flex; align-items: center; gap: 6px; padding: 6px 10px; }
.add-icon { width: 14px; height: 14px; border-radius: 50%; background: #FF5B2E; display: flex; align-items: center; justify-content: center; }
.add-icon::after { content: "+"; color: white; font-size: 10px; line-height: 1; }
.add-text { font-size: 11px; color: #FF5B2E; }
.progress-bar { height: 3px; background: #E5E5EA; margin: 4px 14px 6px; border-radius: 2px; }
.progress-fill { height: 100%; background: #FF5B2E; border-radius: 2px; width: 40%; }
.progress-label { font-size: 9px; color: #8E8E93; padding: 0 14px 4px; text-align: right; }
</style>

        </div>

  </div>

              <div class="item-row"><div class="check"></div><span class="item-text">外套</span><span class="cat-badge" style="background:#E3F2FD;color:#1565C0">衣物</span></div>
              <div class="item-row"><div class="check done"></div><span class="item-text done">充电宝</span><span class="cat-badge" style="background:#E8F5E9;color:#2E7D32">电子</span></div>
